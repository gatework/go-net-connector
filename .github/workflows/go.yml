name: Go
on:
  push:
    branches: ['**']
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  GOWORK: 'off'
  GOFLAGS: '-mod=readonly'
  GOTOOLCHAIN: local
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: make check
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make check CHECK_EXTRA=project-quality
  package:
    needs: [test, quality]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Package exact committed source and all binaries
        run: python3 scripts/release.py package --sha "$GITHUB_SHA"
      - name: Verify immutable bytes and installed worker
        run: |
          python3 scripts/release.py verify --sha "$GITHUB_SHA"
          package_tmp=$(mktemp -d)
          trap 'rm -rf "$package_tmp"' EXIT
          tar -xzf "dist/go-net-connector_$(cat VERSION)_${GITHUB_SHA}_linux_amd64.tar.gz" -C "$package_tmp"
          for binary in netman tftp-archive; do
            "$package_tmp/bin/$binary" --version | grep -F "go-net-connector $(cat VERSION) revision $GITHUB_SHA"
          done
          NC_TEST_ARCHIVE_WORKER="$package_tmp/bin/tftp-archive" go test -race -shuffle=on -count=1 -v ./archive -run TestInstalled
          mkdir "$package_tmp/source"
          tar -xzf "dist/go-net-connector_$(cat VERSION)_${GITHUB_SHA}_source.tar.gz" -C "$package_tmp/source"
          cd "$package_tmp/source/go-net-connector"
          go mod verify
          go mod tidy -diff
          go test -race -shuffle=on -count=1 ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
