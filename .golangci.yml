version: '2'
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - modernize
    - errorlint
    - revive
  settings:
    staticcheck:
      checks:
        - 'SA*'
        - 'ST1003'
        - 'ST1012'
    revive:
      rules:
        - name: unexported-return
        - name: receiver-naming
  exclusions:
    rules:
      # Tests deliberately assert sentinel identity.
      - path: _test\.go
        linters:
          - errorlint
